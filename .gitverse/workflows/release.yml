name: Release

# Mirror the tested packages of the corresponding GitHub Release. GitVerse
# has Linux runners only, so the macOS packages cannot be rebuilt here.
#
# Pushed with the tag, this starts while GitHub is still building the
# release (about 16 minutes): download_release.sh waits for it up to 20 of
# the 30 minutes of the job. If it takes longer, the job fails with a
# message; "Run workflow" on the tag once the GitHub Release is complete.
#
# GitVerse refuses release files larger than 100 MB (the GUI package for
# Linux is about 120 MB): those stay on GitHub only, and the notes of the
# GitVerse Release link to them. Only a tag whose commit has this file, and
# the secret below, can run it: GitVerse has the releases from v1.0.2 on.
#
# The release is made with a GitVerse API key with Repositories → Write, in
# the secret RELEASE_API_KEY of the repository (GitVerse does not take
# secret names that start with GITVERSE_).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    name: Mirror the GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.ref_name }}
      # The largest release file that GitVerse takes, in bytes
      MAX_SIZE: 100000000
    steps:
      # Before the wait for the GitHub Release, which may take 20 minutes
      - name: Check the API key
        shell: bash
        env:
          RELEASE_API_KEY: ${{ secrets.RELEASE_API_KEY }}
        run: |
          if [ -z "${RELEASE_API_KEY}" ]; then
              echo "::error::The repository has no secret RELEASE_API_KEY:" \
                   "add a GitVerse API key with Repositories → Write"
              exit 1
          fi

      - uses: actions/checkout@v4

      - name: Check the version and read the release notes
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^project(AMORPH VERSION \([0-9.]*\).*/\1/p' \
                     CMakeLists.txt)"
          if [ "${TAG}" != "v${version}" ]; then
              echo "::error::Run this workflow on tag v${version}, not ${TAG}"
              exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          bash scripts/ci/release_notes.sh "${TAG}" > notes.md

      - name: Download and verify the GitHub Release
        shell: bash
        run: bash scripts/ci/download_release.sh "${TAG}" release

      - name: Leave the files over 100 MB on GitHub
        id: notes
        shell: bash
        run: |
          mkdir -p github-only
          for f in release/*; do
              if [ "$(stat -c %s "${f}")" -gt "${MAX_SIZE}" ]; then
                  mv "${f}" github-only/
              fi
          done
          if [ -n "$(ls github-only)" ]; then
              {
                  echo
                  echo "GitVerse takes files of up to 100 MB: download these" \
                       "from the GitHub Release (the checksums list them too)."
                  echo
                  for f in github-only/*; do
                      name="$(basename "${f}")"
                      echo "- [${name}](https://github.com/ij3tt/amorph/releases/download/${TAG}/${name})," \
                           "$(( $(stat -c %s "${f}") / 1000000 )) MB"
                  done
              } >> notes.md
          fi
          ls -l release github-only
          {
              echo 'body<<AMORPH_RELEASE_NOTES'
              cat notes.md
              echo 'AMORPH_RELEASE_NOTES'
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '>=1.23'

      # Every file in release/
      - name: Create or update the GitVerse Release
        uses: actions/create-release@v1
        with:
          api_key: ${{ secrets.RELEASE_API_KEY }}
          title: AMORPH ${{ steps.version.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          files: release
          draft: false
          pre_release: false
