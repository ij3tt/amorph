name: Build

# GitVerse CI. The build steps live in scripts/ci/ and are shared with GitHub
# Actions (.github/workflows/build.yml). GitVerse has Linux runners only, a
# 30 minute limit per job and 500 MB of artifacts per account, so the
# Windows executable is built but not run here, and only it is kept.

on:
  push:
  workflow_dispatch:

jobs:
  linux:
    name: Linux build, tests and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        shell: bash
        run: bash scripts/ci/linux.sh

  windows:
    name: Windows executable (mingw cross-compile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: bash
        run: bash scripts/ci/windows_cross.sh

      - uses: actions/upload-artifact@v4
        with:
          name: AMORPH-windows
          path: dist/windows/
          retention-days: 7
          if-no-files-found: error
