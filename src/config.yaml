# Set up everything for an AMORPH run
---

# Number of threads to use
num_threads: 8

# Data file for the run
data_file: "easy_data.txt"

# Which file of DNest4 options to use
dnest4_options_file: "OPTIONS_AGGRESSIVE"

# Seed of the random number generator, a whole number. Without it the time
# is used.
# seed: 42

# Section for things that affect the inference
inference_assumptions:

    # Control points
    control_points: [10.0, 40.0]

    # Maximum number of peaks
    max_num_narrow_peaks: 500
    max_num_wide_peaks: 100

    # What subset of the domain should the amorphous peaks be allowed to
    # appear in? In these units, the domain goes from 0 to 1.
    left_edge: 0.3
    right_edge: 0.7

    # Bounds of the shape parameter nu of the narrow (crystalline) peaks,
    # which are Student-t profiles: nu = 1 is a Lorentzian, a large nu a
    # Gaussian, and nu < 1 has tails heavier than a Lorentzian. The prior is
    # log-uniform between the bounds; the paper uses [0.1, 100], the widest
    # range allowed. See "The shape of the crystalline peaks" in README.md.
    narrow_peak_nu: [0.1, 100.0]

