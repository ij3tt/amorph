name: Build

# The build steps live in scripts/ci/ and are shared with GitVerse CI
# (.gitverse/workflows/build.yml). .github/workflows/release.yml calls this
# workflow and packs the AMORPH-windows, AMORPH-linux and AMORPH-macos
# artefacts, so keep their names and contents.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows executable (mingw cross-compile)
    runs-on: ubuntu-latest
    # Some runner images lack mingw-w64, and installing it can be slow
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: bash scripts/ci/windows_cross.sh

      - uses: actions/upload-artifact@v7
        with:
          name: AMORPH-windows
          path: dist/windows/
          if-no-files-found: error

  windows-run:
    name: Windows executable smoke test
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: AMORPH-windows
          path: dist/windows

      - name: Smoke test
        shell: bash
        run: bash scripts/smoke_test.sh dist/windows/AMORPH.exe build/smoke

  linux:
    name: Linux build, tests and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build and test
        run: bash scripts/ci/linux.sh

      - uses: actions/upload-artifact@v7
        with:
          name: AMORPH-linux
          path: dist/linux/
          if-no-files-found: error

      # The run archive of the smoke test and its figures
      - uses: actions/upload-artifact@v7
        with:
          name: smoke-run-archive
          path: |
            build/smoke/*.amorph
            build/smoke/figures/
          if-no-files-found: error

  gui:
    name: GUI tests and self-test (Linux, no screen)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build, test the GUI and run its self-test
        run: bash scripts/ci/gui.sh

      # A screenshot of every screen of the self-test, and its run archives
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gui-screenshots
          path: |
            build/gui-self-test/*.png
            build/gui-self-test/runs/*/*.amorph
          if-no-files-found: error

  macos:
    name: macOS build, tests and smoke test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build and test
        run: bash scripts/ci/macos.sh

      - uses: actions/upload-artifact@v7
        with:
          name: AMORPH-macos
          path: dist/macos/
          if-no-files-found: error

  # The GUI packaged with PyInstaller on each system, with the sampler that
  # the jobs above built and tested, and the self-test of the packaged
  # program. release.yml attaches the archives to a release.
  gui-package:
    name: GUI package (${{ matrix.system }})
    needs: [windows, linux, macos]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {system: windows-x64, os: windows-latest,
             artefact: AMORPH-windows, sampler: AMORPH.exe}
          - {system: linux-x64, os: ubuntu-latest,
             artefact: AMORPH-linux, sampler: AMORPH}
          - {system: macos-arm64, os: macos-latest,
             artefact: AMORPH-macos, sampler: AMORPH}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artefact }}
          path: build/sampler

      - name: Package the GUI and run the self-test of the package
        shell: bash
        run: |
          bash scripts/ci/gui_package.sh ${{ matrix.system }} \
              build/sampler/${{ matrix.sampler }}

      - uses: actions/upload-artifact@v7
        with:
          name: AMORPH-GUI-${{ matrix.system }}
          path: dist/gui/
          if-no-files-found: error

      # The screenshots and the log of the self-test of the package
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gui-package-test-${{ matrix.system }}
          path: build/gui-package-test/
          if-no-files-found: ignore
