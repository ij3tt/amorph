name: Build

# The build steps live in scripts/ci/ and are shared with GitVerse CI
# (.gitverse/workflows/build.yml).

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows executable (mingw cross-compile)
    runs-on: ubuntu-latest
    # Some runner images lack mingw-w64, and installing it can be slow
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: bash scripts/ci/windows_cross.sh

      - uses: actions/upload-artifact@v4
        with:
          name: AMORPH-windows
          path: dist/windows/
          if-no-files-found: error

  windows-run:
    name: Windows executable smoke test
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: AMORPH-windows
          path: dist/windows

      - name: Smoke test
        shell: bash
        run: bash scripts/smoke_test.sh dist/windows/AMORPH.exe build/smoke

  linux:
    name: Linux build, tests and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        run: bash scripts/ci/linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: AMORPH-linux
          path: dist/linux/
          if-no-files-found: error
