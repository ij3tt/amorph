name: Experiment

# The shape of the crystalline peaks against the maximum numbers of peaks, on
# the two samples whose amorphous fraction can be ambiguous
# (src/N3RAW_amorph.txt, src/G30RAW_amorph.txt; see "The shape of the
# crystalline peaks" in README.md):
#   a) 500 narrow / 100 wide peaks, nu of the narrow peaks in [0.1, 100]
#      (the defaults, the prior of the paper)
#   b) 100 / 50 peaks, nu in [0.1, 100]
#   c) 500 / 100 peaks, nu in [1, 100]
#   d) 100 / 50 peaks, nu in [1, 100]
# Each setting runs twice on each sample with different seeds, and
# scripts/diagnose_posterior.py summarises every run. The runs take hours,
# so this runs on demand only: "Run workflow" on the Actions tab, or the
# label "experiment" on a pull request.

on:
  workflow_dispatch:
    inputs:
      saves:
        description: Maximum number of saved samples per run
        default: "10000"
      minutes:
        description: Time budget of each sampler run, in minutes (at most 270)
        default: "240"
  pull_request:
    types: [labeled]

# Adding the label again restarts the experiment; other labels do not cancel it
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  run:
    name: ${{ matrix.setting.id }} / ${{ matrix.dataset }} / seed ${{ matrix.replicate }}
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'experiment'
    runs-on: ubuntu-latest
    # The sampler time budget plus the build and the post-processing
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        setting:
          - {id: a, narrow: 500, wide: 100, nu: "[0.1, 100.0]"}
          - {id: b, narrow: 100, wide: 50, nu: "[0.1, 100.0]"}
          - {id: c, narrow: 500, wide: 100, nu: "[1.0, 100.0]"}
          - {id: d, narrow: 100, wide: 50, nu: "[1.0, 100.0]"}
        dataset: [N3RAW_amorph.txt, G30RAW_amorph.txt]
        replicate: [1, 2]
    env:
      SAVES: ${{ inputs.saves || '10000' }}
      MINUTES: ${{ inputs.minutes || '240' }}
      DATA_FILE: ${{ matrix.dataset }}
      NARROW: ${{ matrix.setting.narrow }}
      WIDE: ${{ matrix.setting.wide }}
      NU: ${{ matrix.setting.nu }}
      # Different for each replicate and each run of the workflow
      SEED: ${{ github.run_number }}0${{ matrix.replicate }}
    steps:
      - uses: actions/checkout@v4

      - name: Run AMORPH and diagnose the posterior
        run: |
          bash scripts/ci/validate_run.sh . "${DATA_FILE}" "${SAVES}" \
              "${MINUTES}" results \
              "max_num_narrow_peaks=${NARROW}" "max_num_wide_peaks=${WIDE}" \
              "narrow_peak_nu=${NU}" "seed=${SEED}"
          build/venv/bin/python scripts/diagnose_posterior.py build/run \
              --data "build/run/${DATA_FILE}" \
              --json results/diagnosis.json \
              --table results/particles.csv.gz
          printf '{"setting": "%s", "data": "%s", "seed": %s, "max_num_narrow_peaks": %s, "max_num_wide_peaks": %s, "narrow_peak_nu": "%s"}\n' \
              "${{ matrix.setting.id }}" "${DATA_FILE}" "${SEED}" \
              "${NARROW}" "${WIDE}" "${NU}" > results/setting.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment-${{ matrix.setting.id }}-${{ matrix.dataset }}-${{ matrix.replicate }}
          path: results/
          if-no-files-found: ignore

  compare:
    name: Compare
    needs: run
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.label.name == 'experiment')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: experiment-*
          path: runs

      - name: Write the comparison
        run: |
          python3 scripts/ci/compare_experiment.py runs > experiment.md
          cat experiment.md >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@v4
        with:
          name: experiment-summary
          path: experiment.md
